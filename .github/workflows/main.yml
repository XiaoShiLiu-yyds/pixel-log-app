name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Flet
      run: pip install flet

    # 我们直接使用 stable 渠道，不锁定旧版本号，减少冲突概率
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Configure Flutter Licenses
      run: |
        flutter config --no-analytics
        yes | flutter doctor --android-licenses

    # --- 核心修改在这里 ---
    # 我们加上了 "yes |" 
    # 这意味着当 Flet 问 "要下载新版本吗？" 时，系统会自动回答 "y"
    - name: Build APK
      run: |
        yes | flet build apk --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pixel-log-release
        path: build/apk/
