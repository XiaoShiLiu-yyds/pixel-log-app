name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Flet
      run: pip install flet

    - name: Flet Build APK
      # 这里会自动拉取 Android SDK 并打包
      # 请确保你的代码文件名为 main.py
      uses: flet-dev/flet-build-action@v2
      with:
        target: android
        main: main.py
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: daily-checkin-app
        path: build/apk/*.apk
